# hmx — pacman repository
#
# Add this to /etc/pacman.conf. install.sh does it for you; this is the file it
# writes, and the one to read if you would rather do it by hand.
#
#   hmx-pacman.conf:
[hmx]
# SigLevel = Required DatabaseRequired is the safe setting: pacman will refuse
# the database and the package unless both carry a signature from a key it
# trusts. That is the entire point of hosting a third-party repo -- without it,
# anyone who can serve you a file can serve you a binary that runs as root.
#
# To use Required, import the key first (see README). Until you do, pacman will
# refuse to sync -- that is the correct behaviour, not a bug.
SigLevel = Required DatabaseRequired
Server = https://himanshu-2010.github.io/hmx-pacman/$arch
